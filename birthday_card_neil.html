<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Neil, my love 🕸️🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#8f1c1f;
    --maroon-dark:#5c1113;
    --tan:#d9b98a;
    --tan-light:#efe0c4;
    --cream:#f7ecd8;
    --ink:#3a2416;
    --purple:#9b8fd1;
    --shadow: 0 18px 40px rgba(20,8,6,.55);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #4a1d18 0%, #2a1210 55%, #1c0b0a 100%);
    font-family:'Quicksand', sans-serif;
    color:var(--cream);
    overflow-x:hidden;
  }
  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding-top:9vh;
    padding-bottom:6vh;
  }
  .handwrite{ font-family:'Caveat', cursive; }

  #app{
    position:relative;
    width:100%;
    display:flex;
    justify-content:center;
  }

  /* ---------- COVER ---------- */
  #cover-screen{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    transition: transform .7s cubic-bezier(.6,.05,.3,1), opacity .55s ease;
    transform-origin: left center;
    z-index:5;
  }
  #app.open #cover-screen{
    opacity:0;
    transform: rotateY(-95deg) translateX(-6%) scale(.96);
    pointer-events:none;
  }
  .cover-card{
    width:min(78vw, 340px);
    aspect-ratio: 700/905;
    border:none;
    padding:0;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    box-shadow:var(--shadow);
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform .25s ease;
  }
  .cover-card:active{ transform: scale(.97); }
  .cover-card img{ width:100%; height:100%; display:block; object-fit:cover; }
  .cover-hint{
    font-family:'Caveat', cursive;
    font-size:1.35rem;
    color:var(--tan-light);
    opacity:.85;
    letter-spacing:.02em;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.55;} 50%{opacity:1;} }

  /* ---------- BOOK / SPREAD ---------- */
  #book-wrap{
    position:absolute;
    top:0; left:50%;
    transform: translateX(-50%) scaleX(.03);
    opacity:0;
    pointer-events:none;
    width:min(94vw, 700px);
    display:flex;
    flex-direction:column;
    align-items:center;
    transition: transform .65s cubic-bezier(.3,.05,.25,1) .12s, opacity .4s ease .12s;
    perspective: 1800px;
  }
  #app.open #book-wrap{
    transform: translateX(-50%) scaleX(1);
    opacity:1;
    pointer-events:auto;
  }

  .back-btn{
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:.85rem;
    color:var(--cream);
    background:rgba(0,0,0,.28);
    border:1px solid rgba(247,236,216,.35);
    border-radius:999px;
    padding:8px 18px;
    margin-bottom:14px;
    cursor:pointer;
    letter-spacing:.02em;
    transition: background .2s ease, transform .15s ease;
  }
  .back-btn:hover{ background:rgba(0,0,0,.45); }
  .back-btn:active{ transform:scale(.96); }

  #spread{
    display:flex;
    width:100%;
    justify-content:center;
    gap:3px;
    filter:drop-shadow(0 20px 34px rgba(10,4,3,.6));
  }
  .page{
    position:relative;
    width:calc(50% - 2px);
    aspect-ratio:700/905;
    border-radius:6px;
    overflow:hidden;
    background:#000;
    transform-style:preserve-3d;
  }
  .page-left{ border-radius:6px 3px 3px 6px; transform:rotateY(2.5deg); transform-origin:right center;}
  .page-right{ border-radius:3px 6px 6px 3px; transform:rotateY(-2.5deg); transform-origin:left center;}
  .page > img.bg{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
  }
  .hinge-line{
    position:absolute; top:0; bottom:0; left:50%; width:14px; margin-left:-7px;
    background:linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,.35), rgba(0,0,0,0));
    z-index:6; pointer-events:none;
  }

  /* ---------- LEFT PAGE: letter ---------- */
  .letter-btn{
    position:absolute; inset:0;
    border:none; padding:0; margin:0; background:transparent;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .letter-img{
    position:absolute;
    left:50%; top:50%;
    width:70%;
    aspect-ratio:700/905;
    object-fit:cover;
    object-position: top;
    opacity:0;
    transform: translate(-50%,-38%) scale(.4) rotate(-4deg);
    border-radius:4px;
    box-shadow:0 10px 22px rgba(0,0,0,.45);
    transition: transform .55s cubic-bezier(.34,1.15,.4,1), width .55s ease, box-shadow .4s ease, opacity .4s ease;
    transform-origin:center center;
    pointer-events:none;
  }
  .page-left.lifted .letter-img{
    width:92%;
    opacity:1;
    transform: translate(-50%,-50%) scale(1) rotate(0deg);
    box-shadow:0 18px 36px rgba(0,0,0,.55);
    transition: transform .55s cubic-bezier(.34,1.15,.4,1) .08s, width .55s ease .08s, box-shadow .4s ease, opacity .35s ease .08s;
  }
  .page-left.lifted .letter-btn{ cursor: zoom-out; }
  .letter-tap-hint{
    position:absolute; left:50%; bottom:6%; transform:translateX(-50%);
    font-family:'Caveat',cursive; font-size:1.05rem; color:var(--tan-light);
    background:rgba(40,15,13,.55); padding:3px 12px; border-radius:999px;
    pointer-events:none; transition:opacity .3s ease;
    white-space:nowrap;
  }
  .page-left.lifted .letter-tap-hint{ opacity:0; }

  /* ---------- RIGHT PAGE: candles ---------- */
  .candle-stage{ position:absolute; inset:0; }
  .flame{
    position:absolute;
    width:10.6%;
    transform-origin: 50% 92%;
    filter: drop-shadow(0 2px 5px rgba(120,10,10,.5));
    transition: opacity .45s ease;
    will-change: transform;
  }
  .flame.out{ opacity:0; }
  #f1{ left:24.86%; top:44.2%; }
  #f2{ left:42.86%; top:43.87%; }
  #f3{ left:62.57%; top:43.87%; }

  .mic-panel{
    width:min(94vw, 700px);
    box-sizing:border-box;
    margin-top:14px;
    padding:12px 18px 14px;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    background:rgba(20,8,7,.4);
    border:1px solid rgba(247,236,216,.18);
    border-radius:14px;
    z-index:8;
  }
  .meter{
    width:100%; max-width:420px; height:9px; border-radius:999px;
    background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.25);
    overflow:hidden;
  }
  .meter-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,#f4d35e,#ee6c4d,var(--maroon));
    transition:width .06s linear;
  }
  .mic-label{
    font-size:.72rem; letter-spacing:.02em; color:var(--tan-light);
    font-family:'Quicksand',sans-serif; font-weight:600; opacity:.9;
    text-align:center;
  }
  .blow-btn{
    margin-top:2px;
    font-family:'Quicksand',sans-serif; font-weight:700; font-size:.8rem;
    color:var(--maroon-dark);
    background: var(--tan-light);
    border:none; border-radius:999px;
    padding:10px 20px;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.35);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    transition: transform .12s ease, background .15s ease;
  }
  .blow-btn:active, .blow-btn.holding{ transform:scale(.95); background:#fff; }
  .host-note{
    font-size:.64rem; color:var(--tan-light); opacity:.6; text-align:center;
    max-width:320px; line-height:1.3;
  }

  /* ---------- WISH OVERLAY ---------- */
  .wish-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px;
    background:rgba(30,12,10,.55);
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
    z-index:9;
  }
  .wish-overlay.show{ opacity:1; pointer-events:auto; }
  .wish-text{
    font-family:'Caveat',cursive;
    font-size:2.1rem;
    color:#fff;
    text-shadow:0 3px 10px rgba(0,0,0,.6);
    padding:0 10%;
  }
  .relight-btn{
    font-family:'Quicksand',sans-serif; font-weight:700; font-size:.82rem;
    color:#fff; background:var(--maroon);
    border:2px solid rgba(255,255,255,.6);
    border-radius:999px; padding:9px 20px;
    cursor:pointer;
    transition: transform .12s ease;
  }
  .relight-btn:active{ transform:scale(.94); }

  canvas#confetti-canvas{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:10;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>

      <button class="blow-btn" id="blow-btn">hold to blow (or press space)</button>

</div>

<script>
(function(){
  "use strict";

  var app = document.getElementById('app');
  var coverBtn = document.getElementById('cover-btn');
  var backBtn = document.getElementById('back-btn');
  var letterPage = document.getElementById('letter-page');
  var letterBtn = document.getElementById('letter-btn');

  coverBtn.addEventListener('click', function(){ app.classList.add('open'); });
  backBtn.addEventListener('click', function(){
    app.classList.remove('open');
    letterPage.classList.remove('lifted');
  });
  letterBtn.addEventListener('click', function(){
    letterPage.classList.toggle('lifted');
  });

  /* ============ CANDLE BLOW LOGIC ============ */
  var flames = [document.getElementById('f1'), document.getElementById('f2'), document.getElementById('f3')];
  var meterFill = document.getElementById('meter-fill');
  var micLabel = document.getElementById('mic-label');
  var blowBtn = document.getElementById('blow-btn');
  var wishOverlay = document.getElementById('wish-overlay');
  var wishText = document.getElementById('wish-text');
  var relightBtn = document.getElementById('relight-btn');
  var candlePage = document.getElementById('candle-page');

  var BLOW_THRESHOLD = 0.16;
  var HOLD_MS = 500;
  var blowingSince = null;
  var extinguished = false;
  var smoothedLevel = 0;
  var flameSeed = flames.map(function(){ return Math.random()*1000; });

  function setLevel(rawLevel){
    // smooth a little to avoid jitter
    smoothedLevel += (rawLevel - smoothedLevel) * 0.35;
    var pct = Math.max(0, Math.min(1, smoothedLevel));
    meterFill.style.width = (pct*100).toFixed(1) + '%';

    if (extinguished) return;

    var now = performance.now();
    if (pct > BLOW_THRESHOLD){
      if (blowingSince === null) blowingSince = now;
      animateFlames(pct, now);
      if (now - blowingSince >= HOLD_MS){
        extinguishAll();
      }
    } else {
      blowingSince = null;
      animateFlames(pct, now);
    }
  }

  function animateFlames(pct, now){
    flames.forEach(function(f, i){
      if (extinguished) return;
      var flicker = Math.sin((now/90) + flameSeed[i]) * (2 + pct*4);
      var bend = -pct * 34; // degrees, bends "away" from the blow
      var scaleY = 1 - pct*0.18;
      f.style.transform = 'rotate(' + (bend + flicker*0.4) + 'deg) scaleY(' + scaleY + ')';
    });
  }

  function extinguishAll(){
    extinguished = true;
    flames.forEach(function(f){ f.classList.add('out'); });
    micLabel.textContent = 'blown out!';
    setTimeout(function(){
      wishText.textContent = 'make a wish, Neil ✦';
      wishOverlay.classList.add('show');
      launchConfetti();
    }, 500);
  }

  function relight(){
    extinguished = false;
    blowingSince = null;
    smoothedLevel = 0;
    wishOverlay.classList.remove('show');
    flames.forEach(function(f){
      f.classList.remove('out');
      f.style.transform = 'rotate(0deg) scaleY(1)';
    });
    micLabel.textContent = 'blow into your mic to blow out the candles';
    meterFill.style.width = '0%';
  }
  relightBtn.addEventListener('click', relight);

  /* ---------- Web Audio mic input ---------- */
  var audioCtx = null, analyser = null, dataArray = null, micActive = false;

  function startMic(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micLabel.textContent = 'mic not available here — hold the button below to blow';
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.6;
        dataArray = new Uint8Array(analyser.fftSize);
        source.connect(analyser);
        micActive = true;
        micLabel.textContent = 'blow into your mic to blow out the candles';
        requestAnimationFrame(micLoop);
      })
      .catch(function(){
        micLabel.textContent = 'mic blocked — hold the button below to blow instead';
      });
  }

  function micLoop(){
    if (!micActive) return;
    analyser.getByteTimeDomainData(dataArray);
    var sumSquares = 0;
    for (var i=0; i<dataArray.length; i++){
      var v = (dataArray[i]-128)/128;
      sumSquares += v*v;
    }
    var rms = Math.sqrt(sumSquares/dataArray.length);
    // scale rms (typical blow ~0.05-0.4) to a 0-1 usable level
    var level = Math.min(1, rms * 3.2);
    if (!holding) setLevel(level);
    requestAnimationFrame(micLoop);
  }

  /* ---------- Fallback: hold-to-blow button / spacebar ---------- */
  var holding = false;
  var holdStart = 0;
  var holdRAF = null;

  function holdLoop(){
    if (!holding) return;
    var elapsed = performance.now() - holdStart;
    var level = Math.min(1, elapsed/450); // ramps up over ~450ms
    setLevel(level);
    holdRAF = requestAnimationFrame(holdLoop);
  }

  function beginHold(){
    if (holding || extinguished) return;
    holding = true;
    holdStart = performance.now();
    blowBtn.classList.add('holding');
    holdLoop();
  }
  function endHold(){
    if (!holding) return;
    holding = false;
    blowBtn.classList.remove('holding');
    cancelAnimationFrame(holdRAF);
    if (!extinguished) setLevel(0);
  }

  blowBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); beginHold(); });
  window.addEventListener('pointerup', endHold);
  blowBtn.addEventListener('pointerleave', function(){ /* keep holding until pointerup for touch */ });

  window.addEventListener('keydown', function(e){
    if (e.code === 'Space' && app.classList.contains('open') && !e.repeat){
      e.preventDefault();
      beginHold();
    }
  });
  window.addEventListener('keyup', function(e){
    if (e.code === 'Space'){ e.preventDefault(); endHold(); }
  });

  /* Start mic only once the card is opened (so permission prompt feels intentional) */
  var micStarted = false;
  coverBtn.addEventListener('click', function(){
    if (!micStarted){
      micStarted = true;
      startMic();
    }
  });

  /* ============ Confetti ============ */
  var canvas = document.getElementById('confetti-canvas');
  var ctx = canvas.getContext('2d');
  var confettiPieces = [];
  var confettiRAF = null;
  var colors = ['#f4d35e','#ee6c4d','#8f1c1f','#efe0c4','#9b8fd1'];

  function resizeCanvas(){
    var rect = candlePage.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';
  }

  function launchConfetti(){
    resizeCanvas();
    confettiPieces = [];
    var w = canvas.width, h = canvas.height;
    for (var i=0;i<90;i++){
      confettiPieces.push({
        x: w/2 + (Math.random()-0.5)*w*0.4,
        y: h*0.25 + (Math.random()-0.5)*h*0.15,
        vx: (Math.random()-0.5)*8*devicePixelRatio,
        vy: (Math.random()*-6 - 2)*devicePixelRatio,
        size: (4+Math.random()*5)*devicePixelRatio,
        color: colors[Math.floor(Math.random()*colors.length)],
        rot: Math.random()*Math.PI*2,
        vrot: (Math.random()-0.5)*0.3,
        life: 0
      });
    }
    if (confettiRAF) cancelAnimationFrame(confettiRAF);
    confettiTick();
  }

  function confettiTick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var alive = false;
    var g = 0.25*devicePixelRatio;
    confettiPieces.forEach(function(p){
      p.vy += g;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      p.life++;
      if (p.y < canvas.height+40 && p.life < 260){ alive = true; }
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*0.65);
      ctx.restore();
    });
    if (alive){
      confettiRAF = requestAnimationFrame(confettiTick);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }

  window.addEventListener('resize', function(){
    if (wishOverlay.classList.contains('show')) resizeCanvas();
  });

})();
</script>
</body>
</html>
